name: Book

# Builds and type-checks the book, and deploys it to GitHub Pages from `main`.
# Requires Settings -> Pages -> Source: "GitHub Actions" to be enabled once.
#
# Pull requests run the build job only, so a broken example is caught before it
# reaches `main` rather than at deploy time.
on:
  push:
    branches: [main]
    # Kept in sync with `pull_request.paths` below by hand — GitHub Actions
    # does not support YAML anchors.
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
      # The live demos compile the crate and import the npm package, so a
      # change to either can break the book.
      - "packages/**"
      - "js/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
      - "packages/**"
      - "js/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: book

      # `jetli/wasm-pack-action` has had no release since 2022. This one is
      # maintained and installs the same prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: pnpm install --frozen-lockfile

      # The npm package is consumed from source via the workspace link, so it
      # has to be compiled before the book imports it.
      - run: pnpm -C js build

      - run: pnpm -C book build:wasm

      # Type-checks every example file against the generated bindings. Only the
      # Solid example is compiled by the build, so without this the React, Vue,
      # and Svelte snippets could drift from the API they document.
      - run: pnpm -C book check:examples

      - run: pnpm -C book build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/dist

  deploy:
    name: deploy
    needs: build
    # Pull requests build and check, but never publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
